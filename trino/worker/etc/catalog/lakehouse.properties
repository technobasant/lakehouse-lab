# Iceberg tables, catalogued by Apache Polaris over the Iceberg REST protocol.
#
# The thing worth understanding here is that Trino never gets the MinIO root
# credentials. `security=OAUTH2` authenticates Trino to Polaris as a *principal*;
# Polaris then vends short-lived, path-scoped S3 credentials back per request
# (`vended-credentials-enabled=true`). Static keys in this file would work and
# would also hand every Trino user the whole bucket.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=root:s3cr3t-dev-only
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL

# Vending ON, and note what is NOT in this file: any S3 credential at all.
#
# Trino authenticates to Polaris as an OAuth2 principal. Polaris checks the
# grant chain, calls MinIO's STS AssumeRole with its own service-user identity,
# and returns a short-lived session scoped to that table's prefix. Trino uses
# those and never learns a long-lived key.
#
# Getting here needed three things that each fail in a differently misleading
# way: a MinIO *user* rather than root (root gets "Unsupported action
# AssumeRole"), a role ARN that MinIO ignores but the API demands, and
# `stsUnavailable: false` on the catalog — the default is to assume no STS.
iceberg.rest-catalog.vended-credentials-enabled=true

# Iceberg defaults worth being explicit about in a lab: the file format and the
# fact that Trino may write, not just read.
iceberg.file-format=PARQUET

# `iceberg.register-table-procedure.enabled` is deliberately absent. Setting it
# alongside vended credentials makes Trino 483 refuse to *start*:
#   Using the `register_table` procedure with vended credentials is currently
#   not supported
# A startup failure rather than a runtime one, so the whole coordinator is down
# and the catalog that caused it is only named in the stack trace.

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
